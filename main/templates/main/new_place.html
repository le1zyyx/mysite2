<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Add Place</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { display: block; margin-bottom: 10px; padding: 5px; font-size: 16px; width: 300px; }
        label { font-weight: bold; margin-top: 10px; }
        .error { color: red; font-size: 14px; }
        button { padding: 8px 16px; font-size: 16px; }
    </style>
</head>
<body>
<h1>Додай свій улюблений заклад</h1>
<form method="post">
    {% csrf_token %}

    <label for="name">Назва:</label>
    <input type="text" id="name" name="name" value="{{ name|default:'' }}">
    {% if errors.name %}<div class="error">{{ errors.name }}</div>{% endif %}

    <label for="rating">Рейтинг (1-5⭐):</label>
    <input type="number" id="rating" name="rating" min="1" max="5" value="{{ rating|default:'' }}">
    {% if errors.rating %}<div class="error">{{ errors.rating }}</div>{% endif %}

    <button type="submit">Submit</button>
</form>
</body>
</html>
