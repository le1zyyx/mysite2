{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <aside>
        <img src="{% static 'main/img/kyiv-photo.jpg' %}" alt="Photo Kyiv">
        <span class="photo">Photo Kyiv</span>
        <h3>Navigation</h3>
        <ul>
            <li><a href="{% url 'home' %}">Homepage</a></li>
            <li><a href="{% url 'places_list' %}"><i class="bi bi-list"></i> Top places list</a></li>
            <li><a href="{% url 'new_place' %}"><i class="bi bi-plus"></i> Add new place</a></li>
            <li><a href="{% url 'random_place' %}"><i class="bi bi-compass"></i> Where should I go today?</a></li>
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
